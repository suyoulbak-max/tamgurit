name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate content
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/validate-content.cjs
      - name: Build and verify static pages
        run: |
          node tools/build-static.cjs
          node tools/test-adsense-readiness.cjs
          node tools/test-static-post-layout.cjs
          node tools/test-toc-numbering.cjs
          node tools/test-column-thumbnail.cjs
          node tools/test-site-integrity.cjs
          node tools/prepare-pages.cjs
          node tools/test-site-integrity.cjs _site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
