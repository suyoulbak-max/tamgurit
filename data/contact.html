<section class="contact-form-panel">
  <h2>어떤 점이 궁금하신가요?</h2>
  <p>글의 오류나 개선 의견을 보내주세요. 관련 글의 제목·주소와 확인이 필요한 내용을 적어주시면 도움이 됩니다.</p>
  <form class="contact-form" data-contact-form action="https://api.web3forms.com/submit" method="POST">
    <input type="hidden" name="access_key" value="{{access_key}}">
    <input type="hidden" name="from_name" value="{{site_name}}">
    <div class="form-row">
      <label>이름 또는 닉네임<input type="text" name="name" autocomplete="name" maxlength="80" required></label>
      <label>답변받을 이메일<input type="email" name="email" autocomplete="email" maxlength="254" required></label>
    </div>
    <label>문의 제목<input type="text" name="subject" maxlength="120" required></label>
    <label>문의 내용<textarea name="message" rows="7" minlength="10" maxlength="5000" required aria-describedby="contact-message-help"></textarea></label>
    <p id="contact-message-help" class="muted">학생부 원문, 학생 이름·학번, 건강 정보 등 불필요한 개인정보는 적지 마세요. 파일 첨부와 작성 대행은 제공하지 않습니다.</p>
    <input type="checkbox" name="botcheck" hidden tabindex="-1" autocomplete="off">
    <label class="contact-consent"><input type="checkbox" name="consent" required><span><a href="../privacy/index.html">개인정보 처리 안내</a>를 확인했으며, 문의 응답을 위해 입력한 정보가 Web3Forms와 이메일 서비스를 통해 처리되는 데 동의합니다. 동의하지 않으면 문의를 전송할 수 없습니다.</span></label>
    <p class="form-status" data-contact-status role="status" aria-live="polite" tabindex="-1" hidden></p>
    <button class="button primary contact-submit" type="submit" disabled>문의 보내기</button>
    <noscript><p>문의 양식을 이용하려면 브라우저의 자바스크립트를 켜주세요. 현재 내용은 전송되지 않았습니다.</p></noscript>
  </form>
</section>
<div class="notice-box"><strong>문의 안내</strong><p>개별 합격 가능성 예측, 학생부 문장 작성 대행은 제공하지 않습니다. 답변은 문의 내용에 따라 안내하며, 메일 수신 환경에 따라 스팸함도 확인해 주세요.</p></div>
